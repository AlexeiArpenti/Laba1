<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация - League of Legends</title>
    <link rel="icon" href="{{ url_for('static', filename='images/lolicon.png') }}" type="image/png">
    <link rel="stylesheet" href="static/Css/style.css">
    <link rel="stylesheet" href="static/Css/login.css">
</head>
<body>

<div class="auth-container">
    <img src="static/images/lolicon.png" class="auth-logo"> <!-- Если есть лого -->
    <div class="auth-box">
        <h2>Вход в систему</h2>
        <form id="login-form">
            <input type="text" id="login-user" placeholder="Логин" required>
            <input type="password" id="login-pass" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
        <p><a href="/">На главную</a></p>
    </div>
</div>
<script src="static/JavaScript/Auth.js"></script>
</body>
</html>
